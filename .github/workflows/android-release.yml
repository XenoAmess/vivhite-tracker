name: Android Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        # versionCode 依赖完整 git 历史（git rev-list --count HEAD），浅克隆会塌成 1
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v5.6.0
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode signing key
      env:
        SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      run: |
        if [ -n "$SIGNING_KEY" ]; then
          echo "$SIGNING_KEY" | base64 -d > app/release.keystore
          ls -la app/release.keystore
        else
          echo "SIGNING_KEY unavailable; release signing will fail" >&2
          exit 1
        fi

    - name: Build signed release APK
      run: ./gradlew assembleRelease
      env:
        SIGNING_KEY_FILE: "release.keystore"
        KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        ALIAS: ${{ secrets.ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    # App 内更新检查依赖：APK 文件名带 versionName 供展示，version.json 供精确 versionCode 比较
    # changelog 字段为两通道统一的更新说明（App 端优先于 release body 展示）
    - name: Prepare versioned artifacts
      run: |
        VERSION_CODE=$(git rev-list --count HEAD)
        # versionName 从 tag 取，和 build.gradle.kts 逻辑一致
        TAG=$(git describe --tags --abbrev=0 --match 'v*')
        VERSION_NAME="${TAG#v}"
        cp app/build/outputs/apk/release/app-release.apk "vivhite-tracker-${VERSION_NAME}.apk"
        # 更新说明：上一个 tag 到本 tag 的提交摘要（首个 tag 则全部历史，取前 20 条）
        PREV_TAG=$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null || echo "")
        if [ -n "$PREV_TAG" ]; then RANGE="$PREV_TAG..$TAG"; else RANGE="$TAG"; fi
        git log --oneline --no-decorate "$RANGE" | head -20 > changelog.txt
        python3 - "$VERSION_CODE" "$VERSION_NAME" <<'PY'
        import json, sys
        changelog = open("changelog.txt", encoding="utf-8").read().strip()
        with open("version.json", "w", encoding="utf-8") as f:
            json.dump({"versionCode": int(sys.argv[1]), "versionName": sys.argv[2], "changelog": changelog}, f, ensure_ascii=False)
        PY
        cat version.json

    # 增量更新（bsdiff）：对历史第 1,2,4,8... 个 release 生成直达补丁并回打自验；
    # 其余历史版本按二进制分解组成多跳链，全部拍平写进 version.json 的 chains 字段。
    # 补丁/链任一环节失败只丢该条目（客户端自然回退全量），绝不阻塞发布。
    - name: Install bsdiff
      run: sudo apt-get update && sudo apt-get install -y bsdiff

    - name: Generate delta patches and build upgrade chains
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python3 .github/workflows/build_delta_chains.py
        cat version.json

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          vivhite-tracker-*.apk
          patch-*.bspatch
          version.json
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
