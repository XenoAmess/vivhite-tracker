name: Android CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # beta-archive 滚动 release 的资产上传/裁剪（build_beta_chains.py）
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        # versionCode 依赖完整 git 历史（git rev-list --count HEAD），浅克隆会塌成 1
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v5.6.0
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode debug signing key
      env:
        DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
      run: |
        if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > app/debug.keystore
          ls -la app/debug.keystore
        else
          echo "DEBUG_KEYSTORE_BASE64 unavailable (dependabot PR context); Gradle will fall back to default debug key"
        fi

    - name: Run lint
      run: ./gradlew lintDebug

    - name: Run unit tests
      run: ./gradlew testDebugUnitTest

    - name: Generate coverage report
      run: ./gradlew jacocoUnitTestReport

    - name: Build debug APK
      run: ./gradlew assembleDebug

    # 内测包用 release 构建（debuggable=false）：Play Protect 对 debuggable
    # 侧载包告警更重，release 与 debug 共用 keystore 可覆盖安装
    - name: Decode release signing key
      if: github.ref == 'refs/heads/master' && github.event_name == 'push'
      env:
        SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      run: |
        if [ -n "$SIGNING_KEY" ]; then
          echo "$SIGNING_KEY" | base64 -d > app/release.keystore
          ls -la app/release.keystore
        else
          echo "SIGNING_KEY unavailable; beta release signing will fail" >&2
          exit 1
        fi

    - name: Build beta release APK
      if: github.ref == 'refs/heads/master' && github.event_name == 'push'
      run: ./gradlew assembleRelease
      env:
        SIGNING_KEY_FILE: "release.keystore"
        KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        ALIAS: ${{ secrets.ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    # ========== beta 增量更新（ApkDiffPatch，与稳定版同一套）==========
    - name: Install ApkDiffPatch toolchain
      if: github.ref == 'refs/heads/master' && github.event_name == 'push'
      run: |
        mkdir -p apkdiff && cd apkdiff
        gh release download v1.8.1 -R sisong/ApkDiffPatch -p '*bin_linux64*' --clobber
        unzip -o -q ApkDiffPatch_v1.8.1_bin_linux64.zip
        mv -f linux64/ApkNormalized linux64/ZipDiff linux64/ZipPatch ./
        chmod +x ApkNormalized ZipDiff ZipPatch
        echo "APKDIFF_BIN=$PWD" >> "$GITHUB_ENV"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Ensure apksigner 34
      if: github.ref == 'refs/heads/master' && github.event_name == 'push'
      run: |
        APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
        if [ ! -x "$APKSIGNER" ]; then
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" >/dev/null 2>&1 || true
        fi
        if [ ! -x "$APKSIGNER" ]; then
          echo "::warning::build-tools 34.0.0 不可用：本次 beta 仅全量，跳过增量补丁"
          echo "APKSIGNER_OK=0" >> "$GITHUB_ENV"
        else
          echo "APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"
          echo "APKSIGNER_OK=1" >> "$GITHUB_ENV"
        fi

    - name: Normalize and re-sign beta APK
      if: github.ref == 'refs/heads/master' && github.event_name == 'push'
      run: |
        if [ "${APKSIGNER_OK:-0}" = "1" ]; then
          "$APKDIFF_BIN/ApkNormalized" app/build/outputs/apk/release/app-release.apk app-normalized.apk
          "$APKSIGNER" sign --ks app/release.keystore \
            --ks-pass "pass:${KEY_STORE_PASSWORD}" --key-pass "pass:${KEY_PASSWORD}" \
            --ks-key-alias "${ALIAS}" \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out app-published.apk app-normalized.apk
        else
          cp app/build/outputs/apk/release/app-release.apk app-published.apk
        fi
      env:
        KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        ALIAS: ${{ secrets.ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    # 内测版尝鲜通道：master 最新构建 → GitHub Pages /beta/
    # （App 内「内测版尝鲜」按钮比对这里的 version.json）
    - name: Prepare beta channel files
      if: github.ref == 'refs/heads/master' && github.event_name == 'push'
      run: |
        # versionCode/versionName 单一来源：build.gradle.kts 推导后写 version-info.properties
        VERSION_CODE=$(sed -n 's/^versionCode=//p' app/build/outputs/version-info.properties)
        VERSION_NAME=$(sed -n 's/^versionName=//p' app/build/outputs/version-info.properties)
        # 更新说明：最近 tag 以来的提交摘要（无 tag 则全部历史，取前 20 条）
        LAST_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo "")
        if [ -n "$LAST_TAG" ]; then RANGE="$LAST_TAG..HEAD"; else RANGE="HEAD"; fi
        git log --oneline --no-decorate "$RANGE" | head -20 > changelog.txt
        # 发布物 = 归一化+重签的 beta 包（与稳定版同 keystore，可覆盖安装）
        cp app-published.apk vivhite-tracker-beta.apk
        python3 - "$VERSION_CODE" "$VERSION_NAME" <<'PY'
        import json, sys
        changelog = open("changelog.txt", encoding="utf-8").read().strip()
        with open("version.json", "w", encoding="utf-8") as f:
            json.dump({"versionCode": int(sys.argv[1]), "versionName": sys.argv[2], "changelog": changelog}, f, ensure_ascii=False)
        PY
        cat version.json

    # beta 增量更新：滚动存档 beta-archive（最近 8 个内测包）+ ApkDiffPatch 单跳补丁
    # （失败只丢条目，不阻断发布；旧客户端自动全量）
    - name: Build beta delta patches and update beta-archive
      if: github.ref == 'refs/heads/master' && github.event_name == 'push'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        APKDIFF_BIN: ${{ env.APKDIFF_BIN }}
      run: python3 .github/workflows/build_beta_chains.py

    - name: Upload beta channel artifact
      if: github.ref == 'refs/heads/master' && github.event_name == 'push'
      uses: actions/upload-artifact@v7
      with:
        name: beta-channel
        path: |
          vivhite-tracker-beta.apk
          version.json

    - name: Upload lint report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: lint-report
        path: app/build/reports/lint-results-debug.html

    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-reports
        path: app/build/reports/tests/

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report-${{ github.sha }}
        path: app/build/reports/jacoco/
        retention-days: 7

    - name: Upload debug APK
      uses: actions/upload-artifact@v7
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk

  android-test:
    name: Instrumented tests (emulator)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        # 与 build job 一致，保证 instrumented test 里 BuildConfig.VERSION_CODE 准确
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v5.6.0
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode debug signing key
      env:
        DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
      run: |
        if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > app/debug.keystore
        fi

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Run instrumented tests
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 36
        target: default
        arch: x86_64
        profile: pixel_6
        script: ./gradlew connectedDebugAndroidTest

    - name: Upload instrumented test reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: android-test-reports
        path: app/build/reports/androidTests/

  coverage-pages:
    name: Deploy Coverage to GitHub Pages
    runs-on: ubuntu-latest
    needs: [ build ]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
    - name: Download coverage report
      uses: actions/download-artifact@v8
      with:
        name: coverage-report-${{ github.sha }}
        path: coverage

    - name: Generate coverage badge JSON
      run: |
        mkdir -p pages
        python - <<'PY'
        import json
        import xml.etree.ElementTree as ET

        root = ET.parse('coverage/jacoco.xml').getroot()
        pct = 0
        for c in root.findall('counter'):
            if c.get('type') == 'INSTRUCTION':
                covered = int(c.get('covered'))
                missed = int(c.get('missed'))
                pct = round(covered / (covered + missed) * 100)
                break
        color = 'green' if pct >= 80 else 'yellow' if pct >= 60 else 'red'
        with open('pages/coverage.json', 'w') as f:
            json.dump({
                "schemaVersion": 1,
                "label": "coverage",
                "message": f"{pct}%",
                "color": color
            }, f)
        PY
        mkdir -p pages/report
        cp -R coverage/html/* pages/report/
        mv pages/report/index.html pages/report/coverage.html

    # 内测版尝鲜通道文件进 Pages（/beta/version.json + /beta/vivhite-tracker-beta.apk）
    - name: Download beta channel files
      uses: actions/download-artifact@v8
      with:
        name: beta-channel
        path: beta-channel

    - name: Add beta channel to Pages
      run: |
        mkdir -p pages/beta
        cp beta-channel/vivhite-tracker-beta.apk beta-channel/version.json pages/beta/

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: pages/

    - name: Deploy to GitHub Pages
      uses: actions/deploy-pages@v5
